name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Pull and restart services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check syntax
        run: |
          npm install
          npm run check

      - name: Deploy on Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          test -n "$HETZNER_HOST"
          test -n "$HETZNER_USER"
          test -n "$HETZNER_SSH_KEY"
          test -n "$HETZNER_KNOWN_HOSTS"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_deploy_key
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hetzner_deploy_key

          ssh -i ~/.ssh/hetzner_deploy_key "$HETZNER_USER@$HETZNER_HOST" <<'EOF'
          set -euo pipefail
          su - app -c 'cd /home/app/skillmasters-grafiken && git pull --ff-only origin main && npm install --omit=dev --no-package-lock && npm run check'
          systemctl restart skillmasters-portal skillmasters-thumbnails skillmasters-praesentationsfolien
          systemctl is-active --quiet skillmasters-portal
          systemctl is-active --quiet skillmasters-thumbnails
          systemctl is-active --quiet skillmasters-praesentationsfolien
          EOF
