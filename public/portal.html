<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kurs-Thumbnails und Präsentationsfolien</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="portal-body">
    <main class="portal-shell">
      <header class="portal-head">
        <p class="kicker">Skillmasters</p>
        <h1>Kurs-Thumbnails und Präsentationsfolien</h1>
      </header>

      <nav class="portal-options" aria-label="Grafik-App auswählen">
        <a class="portal-option" id="thumbnailAppLink" href="/kurs-thumbnails/">
          <span>Kurs-Thumbnails</span>
          <strong>Titelbasierte Kursgrafiken erzeugen</strong>
          <small>Kapitel- und Lektions-Thumbnails mit festem Skillmasters-Stil.</small>
        </a>
        <a class="portal-option" id="presentationAppLink" href="/praesentationsfolien/">
          <span>Präsentationsfolien</span>
          <strong>Foliengrafiken aus Sprechertext erzeugen</strong>
          <small>Reduzierte Präsentationsbilder mit gleichem Referenzstil.</small>
        </a>
      </nav>
    </main>

    <script src="/portal.js" type="module"></script>
  </body>
</html>
